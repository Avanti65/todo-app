<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Todo List</h1>
    <button type="button" class="btn btn-primary" (click)="onAddNewTask()">Add Task</button>
  </div>
  @if (todos.length == 0) {
    <div class="alert alert-primary">Nothing to do, create your first todo</div>
  } @else {
    <div class="row">
      @for (todo of todos; track todo.id) {
        <div class="col-12 col-md-6 col-lg-4 py-2">
          <app-todo-item
            [todo]="todo"
            (edit)="onEdit($event)"
            (delete)="onDelete($event)"
            (complete)="onComplete($event)"
            (statusChange)="onStatusChange($event)"
          >
          </app-todo-item>
        </div>
      }
    </div>
  }
</div>
