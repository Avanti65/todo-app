<div>
  <h1>{{ todoEditId ? 'Edit Todo' : 'Create Todo' }}</h1>
  <form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
    <label>Title</label>
    <input id="title" type="text" formControlName="title" placeholder="Add todo title here" />

    <label>Description</label>
    <input
      id="desc"
      type="text"
      formControlName="description"
      placeholder="Add todo description here"
    />

    <label>Status</label>
    <select id="staus" formControlName="status">
      @for (status of todoStatuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>

    <button type="submit">{{ todoEditId ? 'Update Todo' : 'Add Todo' }}</button>
    <button type="button" (click)="onCancel()">Cancel</button>
  </form>
</div>
