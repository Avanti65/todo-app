<div class="card shadow-sm" [appTodoStatus]="todo.status">
  <div class="card-body d-flex flex-column">
    <h4 class="card-title text-center">{{ todo.title }}</h4>

    <p class="card-text">{{ todo.description }}</p>

    <div class="mb-3 row">
      <label for="selectStatus" class="col-sm-3 col-form-label">Status</label>
      <div class="col-sm-9">
        <select class="form-select" (change)="onStatusChange($event)">
          @for (status of todoStatuses; track status) {
            <option [value]="status" [selected]="status === todo.status">{{ status }}</option>
          }
        </select>
      </div>
    </div>

    <div class="d-flex gap-2 ms-auto">
      <button type="button" class="btn btn-outline-primary btn-sm" (click)="onEdit()">Edit</button>
      <button type="button" class="btn btn-outline-success btn-sm" (click)="onComplete()">
        Complete
      </button>
      <button type="button" class="btn btn-outline-danger btn-sm" (click)="onDelete()">
        Delete
      </button>
    </div>
  </div>
</div>
