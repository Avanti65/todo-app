<div>
  <h1>{{ todo.title }}</h1>
  <p>{{ todo.description }}</p>
  <label>status</label>
  <select (change)="onStatusChange($event)">
    @for (status of todoStatuses; track status) {
      <option [value]="status" [selected]="status === todo.status">{{ status }}</option>
    }
  </select>
  <button type="button" (click)="onEdit()">Edit</button>
  <button type="button" (click)="onDelete()">Delete</button>
  <button type="button" (click)="onComplete()">Complete</button>
</div>
